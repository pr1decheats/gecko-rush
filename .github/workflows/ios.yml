name: Build unsigned iOS IPA (manual)

# Manual build on a standard GitHub-hosted macOS runner, free in public repos.
# Never schedule the runner in a private repository: the owner requested $0.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-ipa:
    name: Godot 4.6.3 / unsigned iPhone build
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    # The only repository write below creates a draft release for human review.
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.6.3
      RELEASE_VERSION: "2.4.0"
      RELEASE_BUILD: "6"
      RELEASE_TAG: v2.4.0
      RELEASE_BASENAME: GeckoRush-2.4
    defaults:
      run:
        shell: bash
    steps:
      - name: Read source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure isolated build paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "GODOT_BIN=$RUNNER_TEMP/gecko-rush-ios-tools/Godot.app/Contents/MacOS/Godot" \
            "GODOT_IOS_TEMPLATE=$RUNNER_TEMP/gecko-rush-ios-tools/templates/ios.zip" \
            "GECKO_IOS_STAGING_DIR=$RUNNER_TEMP/gecko-rush-ios-source" \
            "IOS_EXPORT_ROOT=$RUNNER_TEMP/gecko-rush-ios-output" \
            "IOS_DERIVED_DATA=$RUNNER_TEMP/gecko-rush-ios-derived" >> "$GITHUB_ENV"

      - name: Assemble and verify frozen signed Android APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          source = Path(os.environ["GITHUB_WORKSPACE"]) / ".github/release-assets/android"
          manifest = json.loads((source / "manifest.json").read_text(encoding="utf-8"))
          expected_name = os.environ["RELEASE_BASENAME"] + ".apk"
          if manifest.get("filename") != expected_name or manifest.get("version") != os.environ["RELEASE_VERSION"]:
              raise SystemExit("Frozen APK manifest filename/version does not match this release")
          def checked_size(value):
              if type(value) is not int or value <= 0:
                  raise SystemExit("Manifest sizes must be positive integers")
              return value
          def checked_digest(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit("Manifest digests must be lowercase SHA-256 values")
              return value
          expected_size = checked_size(manifest.get("size"))
          expected_digest = checked_digest(manifest.get("sha256"))
          parts = manifest.get("parts")
          if not isinstance(parts, list) or not 1 <= len(parts) <= 16:
              raise SystemExit("Frozen APK manifest must list its ordered parts")
          output = Path(os.environ["IOS_EXPORT_ROOT"])
          output.mkdir(parents=True, exist_ok=True)
          apk = output / expected_name
          temporary = output / (expected_name + ".tmp")
          overall = hashlib.sha256()
          total, seen = 0, set()
          try:
              with temporary.open("wb") as destination:
                  for part in parts:
                      name = part.get("file", "")
                      if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*\.bin", name) or name in seen:
                          raise SystemExit("Unsafe or duplicate frozen APK part filename")
                      seen.add(name)
                      size = checked_size(part.get("size"))
                      digest = checked_digest(part.get("sha256"))
                      if size >= 19 * 1024 * 1024:
                          raise SystemExit("Frozen APK parts must each be smaller than 19 MiB")
                      path = source / name
                      if not path.is_file() or path.is_symlink() or path.stat().st_size != size:
                          raise SystemExit(f"Frozen APK part missing or wrong size: {name}")
                      actual = hashlib.sha256()
                      copied = 0
                      with path.open("rb") as handle:
                          for block in iter(lambda: handle.read(1024 * 1024), b""):
                              actual.update(block)
                              overall.update(block)
                              destination.write(block)
                              copied += len(block)
                      if copied != size or actual.hexdigest() != digest:
                          raise SystemExit(f"Frozen APK part checksum failed: {name}")
                      total += copied
              if total != expected_size or overall.hexdigest() != expected_digest:
                  raise SystemExit("Assembled Android APK does not match frozen size/SHA-256")
              temporary.replace(apk)
          finally:
              temporary.unlink(missing_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"ANDROID_APK_PATH={apk}\nANDROID_APK_SHA256={expected_digest}\n")
          print(f"Verified frozen Android APK: {apk.name}, {total} bytes, SHA256 {expected_digest}")
          PY

      - name: Download and verify official Godot and export templates
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/gecko-rush-ios-tools"
          mkdir -p "$tools_dir"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          macos_zip="$tools_dir/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          templates_tpz="$tools_dir/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 --output "$macos_zip" "$release_url/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl --fail --location --retry 3 --output "$templates_tpz" "$release_url/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # SHA-256 digests published for the official 4.6.3-stable release assets.
          printf '%s  %s\n' '30630f3e9b11e10b35c1f90ba8814185dcec43fae1a48345159be7552c64bfe8' "$macos_zip" | shasum -a 256 -c -
          printf '%s  %s\n' '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8' "$templates_tpz" | shasum -a 256 -c -
          unzip -q "$macos_zip" -d "$tools_dir"
          # No global installation: extract only the iOS template from the TPZ.
          unzip -q "$templates_tpz" templates/ios.zip -d "$tools_dir"
          test -x "$GODOT_BIN"
          test -s "$GODOT_IOS_TEMPLATE"
          "$GODOT_BIN" --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare isolated project and project-only preset
        run: |
          set -euo pipefail
          mkdir -p "$GECKO_IOS_STAGING_DIR" "$IOS_EXPORT_ROOT"
          git archive HEAD | tar -x -C "$GECKO_IOS_STAGING_DIR"
          "$GODOT_BIN" --headless --editor --path "$GECKO_IOS_STAGING_DIR" --import
          "$GODOT_BIN" --headless --path "$GECKO_IOS_STAGING_DIR" --script scripts/ci/export_ios.gd -- --template "$GODOT_IOS_TEMPLATE"
          "$GODOT_BIN" --headless --path "$GECKO_IOS_STAGING_DIR" --export-release iOS "$IOS_EXPORT_ROOT/GeckoRush.xcodeproj"
          test -s "$IOS_EXPORT_ROOT/GeckoRush.xcodeproj/project.pbxproj"
          test -s "$IOS_EXPORT_ROOT/GeckoRush.pck"
          test -d "$IOS_EXPORT_ROOT/GeckoRush.xcframework"
          xcodebuild -list -project "$IOS_EXPORT_ROOT/GeckoRush.xcodeproj"

      - name: Verify exported Triada Games launch branding
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$IOS_EXPORT_ROOT/branding-verification.log"
          import json
          import os
          from pathlib import Path
          import plistlib
          import xml.etree.ElementTree as ET

          project = Path(os.environ["IOS_EXPORT_ROOT"]) / "GeckoRush"
          storyboard = project / "Launch Screen.storyboard"
          document = ET.parse(storyboard).getroot()
          if document.get("launchScreen") != "YES":
              raise SystemExit("Exported storyboard is not a native iOS launch screen")
          views = list(document.iter("imageView"))
          if len(views) != 1 or views[0].get("image") != "SplashImage" or views[0].get("contentMode") != "scaleAspectFit":
              raise SystemExit("Native iOS launch screen must aspect-fit only the supplied SplashImage")
          if any("$launch_screen" in value for element in document.iter() for value in element.attrib.values()):
              raise SystemExit("Native iOS launch storyboard contains an unresolved export placeholder")
          info = plistlib.loads((project / "GeckoRush-Info.plist").read_bytes())
          if info.get("UILaunchStoryboardName") != "Launch Screen":
              raise SystemExit("Exported Info.plist does not select the checked native launch storyboard")
          asset = project / "Images.xcassets" / "SplashImage.imageset"
          content = json.loads((asset / "Contents.json").read_text())
          images = content.get("images", [])
          for scale, name in (("2x", "splash@2x.png"), ("3x", "splash@3x.png")):
              if not any(image.get("scale") == scale and image.get("filename") == name for image in images):
                  raise SystemExit(f"Native launch asset catalog does not select {name} at {scale}")
              if not (asset / name).is_file():
                  raise SystemExit(f"Native launch image is absent: {name}")
          print("IOS_BRANDING_STORYBOARD_PASS: Launch Screen, SplashImage, scaleAspectFit, @2x/@3x catalog")
          PY
          "$GODOT_BIN" --headless --path "$GECKO_IOS_STAGING_DIR" \
            --script "$GITHUB_WORKSPACE/.github/check_ios_branding.gd" -- \
            "$GECKO_IOS_STAGING_DIR/assets/triada-games.png" \
            "$IOS_EXPORT_ROOT/GeckoRush/Images.xcassets/SplashImage.imageset/splash@2x.png" \
            "$IOS_EXPORT_ROOT/GeckoRush/Images.xcassets/SplashImage.imageset/splash@3x.png" \
            2>&1 | tee -a "$IOS_EXPORT_ROOT/branding-verification.log"

      - name: Build a real iPhone app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$IOS_EXPORT_ROOT/GeckoRush.xcodeproj" \
            -scheme GeckoRush \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build 2>&1 | tee "$IOS_EXPORT_ROOT/xcodebuild.log"

      - name: Verify Mach-O app and package unsigned IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import plistlib
          import shutil
          import subprocess
          import tempfile
          import zipfile

          output = Path(os.environ["IOS_EXPORT_ROOT"])
          products = Path(os.environ["IOS_DERIVED_DATA"]) / "Build" / "Products"
          apps = [app for app in products.glob("Release-iphoneos/*.app") if (app / "Info.plist").is_file()]
          if len(apps) != 1:
              raise SystemExit(f"Expected one built Release-iphoneos app, found {len(apps)}: {apps}")
          app = apps[0]
          with (app / "Info.plist").open("rb") as handle:
              info = plistlib.load(handle)
          if info.get("CFBundleIdentifier") != "org.geckorush.game":
              raise SystemExit("Built app has an unexpected bundle identifier")
          if "iPhoneOS" not in info.get("CFBundleSupportedPlatforms", []):
              raise SystemExit("Built app is not an iPhoneOS device build")
          if info.get("CFBundleShortVersionString") != os.environ["RELEASE_VERSION"] or info.get("CFBundleVersion") != os.environ["RELEASE_BUILD"]:
              raise SystemExit("Built app version/build does not match this release")
          executable_name = info.get("CFBundleExecutable", "")
          if not executable_name or Path(executable_name).name != executable_name:
              raise SystemExit("Built Info.plist has no safe CFBundleExecutable")
          executable = app / executable_name
          if not executable.is_file() or not os.access(executable, os.X_OK):
              raise SystemExit("Built app executable is absent or not executable")
          file_info = subprocess.check_output(["file", str(executable)], text=True).strip()
          macho_header = subprocess.check_output(["otool", "-hv", str(executable)], text=True)
          if "Mach-O" not in file_info or "arm64" not in file_info or "EXECUTE" not in macho_header:
              raise SystemExit(f"Expected an arm64 Mach-O executable, found: {file_info}\n{macho_header}")
          if not any(app.rglob("*.pck")):
              raise SystemExit("Built app contains no Godot game pack")
          signature = subprocess.run(["codesign", "-dv", str(app)], capture_output=True, text=True)
          if signature.returncode == 0:
              raise SystemExit("Expected an unsigned app; a code signature was unexpectedly present")

          ipa = output / "GeckoRush-unsigned.ipa"
          with tempfile.TemporaryDirectory(prefix="gecko-ipa-", dir=output) as directory:
              stage = Path(directory)
              payload = stage / "Payload"
              payload.mkdir()
              shutil.copytree(app, payload / app.name, symlinks=True)
              subprocess.run(["zip", "-qry", str(ipa), "Payload"], cwd=stage, check=True)
          with zipfile.ZipFile(ipa) as archive:
              names = set(archive.namelist())
              prefix = f"Payload/{app.name}/"
              if prefix + "Info.plist" not in names or prefix + executable_name not in names:
                  raise SystemExit("IPA is missing its built app, Info.plist or executable")
              damaged = archive.testzip()
              if damaged:
                  raise SystemExit(f"IPA ZIP integrity check failed for {damaged}")
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          details = (
              "Gecko Rush: unsigned iPhoneOS IPA\n"
              f"Version: {os.environ['RELEASE_VERSION']} ({os.environ['RELEASE_BUILD']})\n"
              f"Source commit: {os.environ.get('GITHUB_SHA', 'unknown')}\n"
              f"Godot: {os.environ['GODOT_VERSION']}\n"
              f"Executable: {file_info}\n"
              f"SHA256: {digest}\n"
              "No Apple code signature. Sign locally before installation on a normal iPhone.\n"
          )
          (output / "build-info.txt").write_text(details, encoding="utf-8")
          print(details)
          print(f"Verified package: {ipa.name}, {ipa.stat().st_size} bytes")
          PY

      - name: Verify both mobile packages and prepare release files
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/verify_mobile.py" \
            --ipa "$IOS_EXPORT_ROOT/GeckoRush-unsigned.ipa" \
            --apk "$ANDROID_APK_PATH" \
            --apk-sha256 "$ANDROID_APK_SHA256" \
            --version "$RELEASE_VERSION" \
            --build "$RELEASE_BUILD" | tee "$IOS_EXPORT_ROOT/mobile-verification.json"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil

          output = Path(os.environ["IOS_EXPORT_ROOT"])
          basename = os.environ["RELEASE_BASENAME"]
          ipa_name, apk_name = basename + "-unsigned.ipa", basename + ".apk"
          shutil.copyfile(output / "GeckoRush-unsigned.ipa", output / ipa_name)
          with (output / "build-info.txt").open("a", encoding="utf-8") as handle:
              handle.write(
                  f"Android APK: {apk_name}\n"
                  f"Android SHA256: {os.environ['ANDROID_APK_SHA256']}\n"
                  "Frozen signed Android release; CI did not rebuild or re-sign it.\n"
                  "Portable package verification: PASS; all 12 compiled game scripts match byte for byte.\n"
              )
          (output / "README-Sideloadly.txt").write_text(
              "Gecko Rush mobile installation\n\n"
              f"Android: download {apk_name} and open it on your Android device. Allow this download source to install apps when Android asks.\n\n"
              f"iPhone: {ipa_name} is a real arm64 iPhoneOS app for iOS 14+, supplied unsigned. "
              "Use the free Sideloadly desktop application on your own Mac or Windows PC to sign and install it. "
              "Enter your Apple ID only in the local signing tool. Trust your developer profile on the iPhone; "
              "iOS 16+ may require Developer Mode. Free personal profiles usually expire after seven days and require re-signing.\n\n"
              "No Apple account credentials, Apple signing certificates, provisioning profiles or Android private keystores are included in this repository or release.\n"
              "SHA256SUMS records the downloaded release files. build-info.txt records source and build details.\n",
              encoding="utf-8",
          )
          names = [ipa_name, apk_name, "build-info.txt", "README-Sideloadly.txt"]
          checksums = []
          for name in names:
              digest = hashlib.sha256()
              with (output / name).open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              checksums.append(f"{digest.hexdigest()}  {name}\n")
          (output / "SHA256SUMS").write_text("".join(checksums), encoding="utf-8")
          (output / "release-notes.md").write_text(
              f"Gecko Rush {os.environ['RELEASE_VERSION']} ({os.environ['RELEASE_BUILD']}).\n\n"
              "Android APK and unsigned native iPhone IPA. See README-Sideloadly.txt for installation and SHA256SUMS for checksums.\n\n"
              "Draft pending independent download verification before publication.\n",
              encoding="utf-8",
          )
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GeckoRush-unsigned-ipa
          path: |
            ${{ env.IOS_EXPORT_ROOT }}/GeckoRush-unsigned.ipa
            ${{ env.IOS_EXPORT_ROOT }}/build-info.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Keep Xcode build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GeckoRush-ios-build-log
          path: ${{ env.IOS_EXPORT_ROOT }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create draft mobile release for independent verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An existing release or tag must never be reused or overwritten.
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          repository, tag = os.environ["GITHUB_REPOSITORY"], os.environ["RELEASE_TAG"]
          base = os.environ["GITHUB_API_URL"].rstrip("/")
          for endpoint in (f"repos/{repository}/releases/tags/{tag}", f"repos/{repository}/git/ref/tags/{tag}"):
              request = urllib.request.Request(
                  f"{base}/{endpoint}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise SystemExit(f"Cannot safely check release/tag {tag}: HTTP {error.code}") from error
              raise SystemExit(f"Refusing to overwrite existing release or tag {tag}")
          PY
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Gecko Rush $RELEASE_VERSION" \
            --notes-file "$IOS_EXPORT_ROOT/release-notes.md" \
            "$IOS_EXPORT_ROOT/$RELEASE_BASENAME-unsigned.ipa" \
            "$ANDROID_APK_PATH" \
            "$IOS_EXPORT_ROOT/SHA256SUMS" \
            "$IOS_EXPORT_ROOT/build-info.txt" \
            "$IOS_EXPORT_ROOT/README-Sideloadly.txt"
