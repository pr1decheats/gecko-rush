name: Verify and publish Windows 2.6 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read frozen source and release parts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reconstruct checked Windows ZIP and Android comparison package
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'gecko-windows-release'
          New-Item -ItemType Directory -Force $output | Out-Null
          "WINDOWS_OUTPUT=$output" >> $env:GITHUB_ENV
          python .github/assemble_release.py --manifest .github/release-assets/windows/manifest.json --output "$output/GeckoRush-2.6-Windows.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP assembly failed' }
          python .github/assemble_release.py --manifest .github/release-assets/android/manifest.json --output "$output/GeckoRush-2.6.apk"
          if ($LASTEXITCODE -ne 0) { throw 'Android comparison assembly failed' }
          Expand-Archive -LiteralPath "$output/GeckoRush-2.6-Windows.zip" -DestinationPath "$output/app"

      - name: Verify actual native PE metadata and all game scripts
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/verify_windows.py --exe "$env:WINDOWS_OUTPUT/app/GeckoRush.exe" --apk "$env:WINDOWS_OUTPUT/GeckoRush-2.6.apk" --apk-sha256 6294e5f4a0c67f98f6f8a20fe8f942429f74e0115b8c56dc45cfb594d59178c5 | Tee-Object -FilePath "$env:WINDOWS_OUTPUT/windows-package-verification.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows package verification failed' }

      - name: Launch the exact release EXE on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:WINDOWS_OUTPUT 'app/GeckoRush.exe'
          $log = Join-Path $env:WINDOWS_OUTPUT 'native-windows.log'
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--audio-driver', 'Dummy', '--fixed-fps', '60', '--quit-after', '360', '--log-file', $log) -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Release EXE did not finish the native startup check'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Release EXE failed with exit code $($process.ExitCode)" }
          $text = Get-Content -LiteralPath $log -Raw
          $text | Write-Output
          if ($text -notmatch 'Godot Engine v4\.6\.3' -or $text -match '(?m)^(ERROR:|SCRIPT ERROR:)') {
            throw 'Native startup log is missing or contains an engine/script error'
          }
          $runtimeLog = Join-Path $env:WINDOWS_OUTPUT 'exported-runtime.log'
          $runtimeScript = (Join-Path $env:GITHUB_WORKSPACE '.github/check_release_runtime.gd').Replace('\', '/')
          $appRoot = (Join-Path $env:WINDOWS_OUTPUT 'app').Replace('\', '/')
          $packPath = $exe.Replace('\', '/')
          $runtime = Start-Process -FilePath $exe -ArgumentList @('--headless', '--audio-driver', 'Dummy', '--main-pack', $packPath, '--path', $appRoot, '--fixed-fps', '60', '--quit-after', '600', '--script', $runtimeScript, '--log-file', $runtimeLog) -PassThru
          if (-not $runtime.WaitForExit(60000)) {
            $runtime.Kill()
            if (Test-Path $runtimeLog) { Get-Content $runtimeLog -Raw | Write-Output }
            throw 'Exported character runtime check timed out'
          }
          $runtime.Refresh()
          $runtimeText = Get-Content -LiteralPath $runtimeLog -Raw
          $runtimeText | Write-Output
          if ($runtime.ExitCode -ne 0 -or $runtimeText -notmatch 'RELEASE_RUNTIME: 67 checks, 0 failures' -or $runtimeText -match '(?m)^(ERROR:|SCRIPT ERROR:)') {
            throw 'Exported illustrations or desktop 240 FPS policy failed on Windows'
          }
          $package = Get-Content "$env:WINDOWS_OUTPUT/windows-package-verification.json" -Raw | ConvertFrom-Json
          $report = @{
            result = 'PASS'; source_commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID;
            package = $package; native_windows = @{
              exit_code = 0; mode = 'headless'; frames = 360; simulation_seconds = 6;
              exported_runtime_checks = 67; illustrated_characters = 21; illustrated_poses = 42; desktop_fps_cap_applied = 240;
              platform = [System.Environment]::OSVersion.VersionString;
              limit = 'Native Windows startup/menu logic checked; GPU rendering and actual display FPS were not measured.'
            }
          }
          $report | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 "$env:WINDOWS_OUTPUT/windows-native-verification.json"
          $zipHash = (Get-FileHash "$env:WINDOWS_OUTPUT/GeckoRush-2.6-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$zipHash  GeckoRush-2.6-Windows.zip" | Set-Content -Encoding utf8 "$env:WINDOWS_OUTPUT/Windows-SHA256SUMS.txt"

      - name: Keep verified Windows release and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GeckoRush-Windows-verified
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.WINDOWS_OUTPUT }}/GeckoRush-2.6-Windows.zip
            ${{ env.WINDOWS_OUTPUT }}/windows-native-verification.json
            ${{ env.WINDOWS_OUTPUT }}/Windows-SHA256SUMS.txt
            ${{ env.WINDOWS_OUTPUT }}/native-windows.log
            ${{ env.WINDOWS_OUTPUT }}/exported-runtime.log

      - name: Add Windows files to the existing 2.6 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v2.6.0 --repo $env:GITHUB_REPOSITORY --json isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw 'Existing mobile release was not found' }
          gh release upload v2.6.0 --repo $env:GITHUB_REPOSITORY "$env:WINDOWS_OUTPUT/GeckoRush-2.6-Windows.zip" "$env:WINDOWS_OUTPUT/windows-native-verification.json" "$env:WINDOWS_OUTPUT/Windows-SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release asset upload failed; existing assets were not overwritten' }
