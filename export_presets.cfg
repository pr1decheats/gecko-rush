; Mobile source presets. Install matching Godot export templates and your SDK.
; Signing credentials belong in local editor settings/export_credentials.cfg.

[preset.0]
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="LICENSE,assets/fonts/*.txt"
exclude_filter="tests/*,docs/*,scripts/ci/*,.github/*,README.md"
export_path="build/android/GeckoRush.apk"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=7
version/name="2.5.0"
package/unique_name="org.geckorush.game"
package/name="Gecko Rush"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
permissions/vibrate=false

